# INSTANIATION FOR DELTAMAKER PRO
# DeltaMaker Pro with Manta E3EZ board, canbus toolhead support, Skybox and Skylight with 30 neopixels.
#   with Bondtech LGX lite direct-drive, Mosquito hotend, with offset probe (solenoid)
#   with two bowden extruders, T0 and T1
#
# Date: 10/15/2025
# Filename: printer-1818-moonraker-manta.cfg
#
# Copy to ~/printer_data/config/printer.cfg

# # T E S T # #
[gcode_macro START_TEST]
gcode:
    UPDATE_DELAYED_GCODE ID=TEST_SERVO_UP DURATION=1
[gcode_macro STOP_TEST]
gcode:
    UPDATE_DELAYED_GCODE ID=TEST_SERVO_UP DURATION=0
    UPDATE_DELAYED_GCODE ID=TEST_SERVO_DOWN DURATION=0

[delayed_gcode TEST_SERVO_UP]
initial_duration: 0
gcode:
    #LIFT_NOZZLE
    T1
    UPDATE_DELAYED_GCODE ID=TEST_SERVO_DOWN DURATION=2
    
[delayed_gcode TEST_SERVO_DOWN]
initial_duration: 0
gcode:
    #LOWER_NOZZLE
    T0
    UPDATE_DELAYED_GCODE ID=TEST_SERVO_UP DURATION=2

#####################################################################
##### START AND END GCODE #####
   
   
[gcode_macro START_PRINT]
gcode:
   START_PRINT_BASE {raw_params}
   SET_VELOCITY_LIMIT VELOCITY=200 ACCEL=2500 ACCEL_TO_DECEL=1250

   {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}
   {% set EXTRUDER1_TEMP = params.EXTRUDER1_TEMP|default(190)|float %}
   
   SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_TEMP}
   SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={EXTRUDER1_TEMP}
   
   
    # Home the printer
    G28
    # Move the nozzle to purge area
    G91
    G1 Z-40 F3000
    G1 X0 Y-200
    # Set and wait for nozzle to reach temperature
    #M109 S{EXTRUDER_TEMP}
    
    # Use absolute coordinates
    G90
    # purge both nozzles
    T1
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER1_TEMP-0.5} MAXIMUM={EXTRUDER1_TEMP}
    G1 E50 F300
    T0
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER_TEMP-0.5} MAXIMUM={EXTRUDER_TEMP}
    G1 E50 
    G1 X0 Y0 F4200
    
[gcode_macro END_PRINT]
gcode:
    END_PRINT_BASE
    
    TURN_OFF_HEATERS
    # Home
    G28
    # Disable steppers
    M84
   
   
   

