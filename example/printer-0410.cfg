##### SPECIFY PRINTER DIMENSIONS #####
[printer]
print_radius: 260.0 		# approx 18 inch diameter build area
#delta_radius: 277.246 		# actual delta radius from CAD
[stepper_a]
#position_endstop: 530 		# approx 12 inch high build volume
#arm_length: 525
[bed_mesh]
mesh_radius: 225 		# usually 220 (+/-)
[delta_calibrate]
radius: 220 			# usually 220

[probe]
samples: 3

##### CALIBRATION DATA #####
[printer]
max_accel: 2500
square_corner_velocity: 5.0
[input_shaper]

[extruder]
#dir_pin: PD6
###heater_pin: multi_pin:dual_heater 	# Mosquito Magnum+ with 2 heaters
#rotation_distance: 33.275      # 1/12/2024, Classic DeltaMaker Extruder
#dir_pin: !PD6	        # reversed direction
rotation_distance: 5.7 	# BondTech LGX Lite
nozzle_diameter: 0.5
sensor_type: ATC Semitec 104NT-4-R025H42G
#control: pid
#pid_Kp: 34.298
#pid_Ki: 2.287
#pid_Kd: 128.617

[extruder1]
#rotation_distance: 33.275      # 1/12/2024, Classic DeltaMaker Extruder
rotation_distance: 5.7 	# BondTech LGX Lite
nozzle_diameter: 0.5
sensor_type: ATC Semitec 104NT-4-R025H42G
control: pid
pid_Kp: 34.298
pid_Ki: 2.287
pid_Kd: 128.617

[servo nozzle_lift]
pin: PA7

