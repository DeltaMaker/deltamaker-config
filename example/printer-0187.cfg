# INSTANIATION FOR DELTAMAKER 2 with standard Wiring (stepper C/Extruder NOT swapped)
# DeltaMaker 2 with SKR-Pico board, classic extruder, print head and probe. 
#
# Date: 9/24/2025
# Filename: printer-910-classic-upgrade-pico.cfg
#
# Upgraded a classic DeltaMaker 2 from Azteeg X3 to SKR-Pico, added Skylight LEDs, 
#   Rewire existing harnesses to be compatible with SKR Pico, Servo signal support,
#   Second +24V wire for HE1, No CANBUS, No second extruder motor driver.

# Copy to ~/printer_data/config/printer.cfg


##### START AND END GCODE #####
[gcode_macro START_PRINT]
gcode:
   START_PRINT_BASE
   SET_VELOCITY_LIMIT VELOCITY=150 ACCEL=2000 ACCEL_TO_DECEL=1000

[gcode_macro END_PRINT]
gcode:
   END_PRINT_BASE
   M107  # turn off cooling fan
 
##### OPTIONAL PART COOLING FAN #####
[fan]
pin: rpi:gpio16
kick_start_time: 0.1
off_below: 0.2
cycle_time: 0.005
max_power: 0.8
hardware_pwm: False

##### SELECT PRIMARY MCU BOARD #####
[mcu]
#serial: /dev/serial/by-id/usb-Klipper_rp2040_45503571290F1AD8-if00  # 0376
serial: /dev/serial/by-id/usb-Klipper_rp2040_45503571288FFAC8-if00  # 0187
restart_method: command

#[mcu ebb36_1]
#serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_570043001850425539393020-if00

##### INCLUDE TOOLHEAD AND PROBE TYPE #####
[include /home/pi/deltamaker-config/toolhead-bowden.cfg]
#[include /home/pi/deltamaker-config/toolhead1-bowden.cfg]
[include /home/pi/deltamaker-config/probe-classic.cfg]
#[include /home/pi/deltamaker-config/probe-servo-tap.cfg]

##### CLASSIC DELTAMAKER EXTRUDER #####
[extruder]
rotation_distance: 33.275 	# Classic extruder
sensor_type: EPCOS 100K B57560G104F

# for factory calibration (delta_calibrate, etc)
#[include /home/pi/deltamaker-config/probe-calibrate.cfg]

##### SPECIFY PRINTER DIMENSIONS #####
[printer]
print_radius: 140.0 		   # approx 9 inch diameter build area
delta_radius: 106.8621 	# actual delta radius from CAD
[stepper_a]
position_endstop: 275 		# approx 10 inch high build 
arm_length: 265
[bed_mesh]
mesh_radius: 110 		# usually 110 (+/-)
[delta_calibrate]
radius: 110 			# usually 110

##### SPECIFY NUMBER OF STATUS LEDS #####
[neopixel status_leds]
chain_count: 36

##### INCLUDE BOARD-SPECIFIC PIN DEFINITIONS #####
[include /home/pi/deltamaker-config/motion-system-skr-pico.pins]
[include /home/pi/deltamaker-config/toolhead-skr-pico.pins]
#[include /home/pi/deltamaker-config/toolhead1-skr-pico-ebb.pins]

##### INCLUDE DEFAULT MACROS FOR START/END PRINT AND PAUSE/RESUME #####
[include /home/pi/deltamaker-config/deltamaker-default-macros.cfg]

##### INCLUDE BASE PRINTER CONFIGURATION #####
[include /home/pi/deltamaker-config/deltamaker-mainsail-base.cfg]
[include /home/pi/deltamaker-config/deltamaker-skylight-macros.cfg]

##### CALIBRATION DATA #####
[printer]
max_accel: 2500
square_corner_velocity: 5.0
#[input_shaper]
[extruder]
dir_pin: gpio13     #do not reverse direction
max_extrude_only_velocity: 40
nozzle_diameter: 0.5
#control: pid
#pid_Kp: 34.298
#pid_Ki: 2.287
#pid_Kd: 128.617

# [extruder]
control = pid
pid_kp = 35.601
pid_ki = 2.825
pid_kd = 112.144


