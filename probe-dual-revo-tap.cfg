#
# Date: 10/15/2025 (was 9/13/2025)
#
# DeltaMaker printer config file: deltamaker-dual-revo-macros.cfg
# Revo Dual Extruder: DeltaMaker Dual Extruder
#
# Toolhead Objects: Extruder, Extruder1, Hotend, Fan, Probe
# Electrical Connector: Classic Molex 16-pin Toolhead connector
#

[include /home/pi/deltamaker-config/probe-servo-tap.cfg]

##### INITIALIZATION #####
[delayed_gcode STARTUP_INIT_TOOL]
initial_duration: 0.1   # was 1
gcode:
   {% set current_tool = printer.save_variables.variables.get("current_tool", 0) %}
   SET_GCODE_VARIABLE MACRO=SELECT_TOOL VARIABLE=current_tool VALUE={current_tool}

##### OVERRIDE BUILD-IN PROBE COMMAND #####
[gcode_macro PROBE]
rename_existing: PROBE_REAL
gcode:
   M118 // PROBE {rawparams}
   SELECT_TOOL T=0
   PROBE_REAL {rawparams}
   SELECT_TOOL T={printer.gcode

[gcode_macro SELECT_TOOL]
variable_current_tool: 0
gcode:
   {% set tool = params.T|default(0)|int %}
   {% if tool != current_tool %}
      M118 // SELECT_TOOL tool={tool} current_tool={current_tool}
      {% if tool == 1 %}
         ACTIVATE_EXTRUDER EXTRUDER=extruder1
         LIFT_NOZZLE
      {% else %}
         ACTIVATE_EXTRUDER EXTRUDER=extruder
         LOWER_NOZZLE
      {% endif %}
      SET_GCODE_VARIABLE MACRO=SELECT_TOOL VARIABLE=current_tool VALUE={tool}
      RESTORE_GCODE_OFFSET TOOL={tool} VERBOSE=1
   {% endif %}

[gcode_macro T0]
gcode:
   SELECT_TOOL T=0

[gcode_macro T1]
gcode:
   SELECT_TOOL T=1

