
# INSTANIATION FOR DELTAMAKER PRO
# DeltaMaker Pro with Manta E3EZ board, canbus toolhead support, Skybox and Skylight with 30 neopixels.
#   with Bondtech LGX lite direct-drive, Mosquito hotend, with offset probe (solenoid)
#   with two bowden extruders, T0 and T1
#
# Date: 10/15/2025
# Filename: printer-1818-moonraker-manta.cfg
#
# Copy to ~/printer_data/config/printer.cfg

##### START AND END GCODE #####
[gcode_macro START_PRINT]
gcode:
   START_PRINT_BASE
   SET_VELOCITY_LIMIT VELOCITY=200 ACCEL=2500 ACCEL_TO_DECEL=1250

[gcode_macro END_PRINT]
gcode:
   END_PRINT_BASE

##### SELECT PRIMARY MCU BOARD
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_57003B0009504B5735313920-if00
restart_method: command

#canbus_uuid: b82d6cd6f7dc
#canbus_interface: can0

##### INCLUDE BOARD-SPECIFIC PIN DEFINITIONS #####
#[include /home/pi/deltamaker-config/motion-system-rev-CE-skr-pico.pins]
#[include /home/pi/deltamaker-config/motion-system-CE-skr-pico.pins]
#[include /home/pi/deltamaker-config/toolhead0-EC-skr-pico.pins]

[include /home/pi/deltamaker-config/motion-system-rev-manta-e3ez.pins]  # reversed motor directions
[include /home/pi/deltamaker-config/toolhead-manta-e3ez.pins]
[include /home/pi/deltamaker-config/toolhead1-manta-e3ez.pins]

##### CANBUS TOOLHEAD MCU AND PIN DEFINITIONS #####
#[mcu ebb36]    # default extruder, toolhead T0
#canbus_uuid: 667e25519d16
#[include /home/pi/deltamaker-config/toolhead-ebb36-canbus.pins]

##[mcu ebb36_1]    # extruder1, toolhead T1
##canbus_uuid: 667e25519d16
##[include /home/pi/deltamaker-config/toolhead1-ebb36-canbus.pins]

##### INCLUDE TOOLHEAD AND PROBE TYPE #####
#

[include /home/pi/deltamaker-config/toolhead-bowden-classic.cfg]
[include /home/pi/deltamaker-config/toolhead1-bowden-classic.cfg]
[include /home/pi/deltamaker-config/probe-dual-revo-tap.cfg]


#[include /home/pi/deltamaker-config/probe-classic.cfg]
#[include /home/pi/deltamaker-config/probe-offset.cfg]
#[include /home/pi/deltamaker-config/toolhead-direct-drive.cfg]
#[include /home/pi/deltamaker-config/toolhead1-direct-drive.cfg]

##### SPECIFY NUMBER OF STATUS LEDS #####
#[neopixel status_leds]
#chain_count: 30
##### SKYLIGHT STATUS LEDS MACROS #####
#[include /home/pi/deltamaker-config/deltamaker-skylight-macros.cfg]

##### INCLUDE DEFAULT MACROS FOR START/END PRINT AND PAUSE/RESUME #####
[include /home/pi/deltamaker-config/deltamaker-default-macros.cfg]

##### INCLUDE BASE PRINTER CONFIGURATION #####
[include /home/pi/deltamaker-config/deltamaker-moonraker-base.cfg]

##### SPECIFY PRINTER DIMENSIONS #####
#
[printer]
print_radius: 260.0 		   # approx 18 inch diameter build area
delta_radius: 277.246 		# actual delta radius from CAD
[stepper_a]
position_endstop: 530 		# approx 18 inch high build volume
arm_length: 525			   # arm length from cad
[bed_mesh]
mesh_radius: 225 		      # usually 220 (+/-)
[delta_calibrate]
radius: 220 			      # usually 220


##### CALIBRATION DATA #####
[printer]
max_accel: 2500
square_corner_velocity: 5.0
[input_shaper]

[extruder]
dir_pin: PD6
rotation_distance: 33.275      # 1/12/2024, Classic DeltaMaker Extruder
nozzle_diameter: 0.5
sensor_type: ATC Semitec 104NT-4-R025H42G
control: pid
pid_Kp: 34.298
pid_Ki: 2.287
pid_Kd: 128.617

[extruder1]
rotation_distance: 33.275      # 1/12/2024, Classic DeltaMaker Extruder
nozzle_diameter: 0.5
sensor_type: ATC Semitec 104NT-4-R025H42G
control: pid
pid_Kp: 34.298
pid_Ki: 2.287
pid_Kd: 128.617

[servo nozzle_lift]
pin: PA7

[probe]
z_offset = -1.304
